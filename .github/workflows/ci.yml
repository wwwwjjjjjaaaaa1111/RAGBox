name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的新推送取消还在跑的旧任务，省额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 防误提交守卫：密钥、数据库、用户上传与向量数据绝不入库。
  # 任何一条命中即失败，并在日志里列出违规文件。
  guard:
    name: "guard: no secrets or runtime data tracked"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查被跟踪文件中是否含密钥/数据库/运行时数据
        run: |
          VIOLATIONS="$(git ls-files | grep -E \
            '(^|/)\.env$|\.db$|\.db\.|(^|/)node_modules/|^backend-server/upload/|^AI-server/ai_chroma/|^AI-server/charts/|\.pem$' \
            || true)"
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::以下文件不应被跟踪："
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "OK：未发现密钥或运行时数据文件"

  backend:
    name: "backend: typecheck + tests (PostgreSQL)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ragbox
          POSTGRES_PASSWORD: ragbox-dev-password
          POSTGRES_DB: ragbox
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragbox"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: backend-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend-server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npx tsc -p tsconfig.json --noEmit
      - name: 测试（每套件独立 PG 数据库）
        env:
          # helpers.ts 用 TEST_DATABASE_URL 作为管理连接，按套件 CREATE/DROP 数据库。
          TEST_DATABASE_URL: postgresql://ragbox:ragbox-dev-password@127.0.0.1:5432/postgres
        run: npm test

  mcp-server:
    name: "mcp-server: typecheck + build + tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npm run build
      # 冒烟测试自建 stdio 子进程，不依赖 RAGBox 后端（错误路径即验证目标）。
      - run: npm test

  client:
    name: "client: build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --no-audit --no-fund
      # 不依赖 .env：代码内含默认值（API 地址、上传参数）。
      - run: npm run build

  ai-server:
    name: "ai-server: syntax + import smoke"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: AI-server/requirements.txt
      - run: pip install -r requirements.txt
      - name: 全量语法编译
        run: python -m compileall -q main.py app
      - name: 应用可导入（不连外部服务）
        run: python -c "import main; print('AI-server import OK')"
