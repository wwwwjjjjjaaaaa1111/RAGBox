services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ragbox-qdrant
    restart: unless-stopped
    ports:
      # 仅映射到本机，供非 Docker 方式启动的 AI-server 连接（6333=HTTP，6334=gRPC）。
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    # 镜像为精简镜像（无 shell/wget），无法做进程内健康检查；
    # qdrant 秒级就绪，AI 服务按请求连接，无需 depends_on 健康门槛。

  postgres:
    image: postgres:16-alpine
    container_name: ragbox-postgres
    restart: unless-stopped
    # 默认账号仅用于本地开发；生产部署应通过环境变量覆盖。
    environment:
      POSTGRES_USER: ragbox
      POSTGRES_PASSWORD: ragbox-dev-password
      POSTGRES_DB: ragbox
    ports:
      # 仅映射到本机，供非 Docker 方式启动的 backend-server 连接。
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragbox -d ragbox"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend-server
    container_name: ragbox-backend
    restart: unless-stopped
    environment:
      # 容器内固定值；其余配置从 backend-server/.env 继承。
      DATABASE_URL: postgresql://ragbox:ragbox-dev-password@postgres:5432/ragbox?connection_limit=10
      AI_SERVICE_BASE_URL: http://ai:8000
      UPLOAD_MAX_FILE_SIZE_MB: ${UPLOAD_MAX_FILE_SIZE_MB:-20}
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-12000}
    env_file:
      - ./backend-server/.env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    volumes:
      # 业务数据已迁移至 postgres；该卷仅保留兼容（迁移记录等），可在确认无需回滚后移除。
      - backend-upload:/app/upload
    depends_on:
      postgres:
        condition: service_healthy

  ai:
    build: ./AI-server
    container_name: ragbox-ai
    restart: unless-stopped
    environment:
      # 容器网络内回调地址固定指向 backend 服务名；模型凭据等从 AI-server/.env 继承。
      NODE_BASE_URL: http://backend:3001/v1
      HOST: 0.0.0.0
      QDRANT_URL: http://qdrant:6333
    env_file:
      - ./AI-server/.env
    volumes:
      # 向量数据现由 qdrant 服务持久化；旧 chroma 卷保留仅作回滚备份，确认稳定后可移除。
      - ai-chroma:/app/ai_chroma
      # 与 backend 共享上传文件卷：入库任务通过绝对路径读取 backend 存储的文件。
      - backend-upload:/app/upload
      # 聊天中生成的图表（含数据核对页 PDF）。
      - charts-data:/app/charts
    depends_on:
      backend:
        condition: service_healthy
      qdrant:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    container_name: ragbox-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: ragbox-grafana
    restart: unless-stopped
    environment:
      # 本地开发默认凭据；对外部署务必通过环境变量覆盖。
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ragbox-dev-password
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 界面中文 + 亮色主题（与前端风格一致）。
      GF_USERS_DEFAULT_LANGUAGE: zh-Hans
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  client:
    build: ./client
    container_name: ragbox-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      - backend
      - ai

volumes:
  postgres-data:
  qdrant-data:
  prometheus-data:
  grafana-data:
  backend-upload:
  ai-chroma:
  charts-data:
